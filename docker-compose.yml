version: '3.8'
services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000

  api:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - pg
      - vector-db
    env_file: .env

  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  vector-db:
    image: qdrant/qdrant:v1.14.1
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"

  crawler:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && playwright install --with-deps && python run_once.py"
    volumes:
      - ./crawler:/app
    depends_on:
      - api
